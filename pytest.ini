[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

norecursedirs =
    _local_junk
    .git
    .venv
    venv
    build
    dist
    __pycache__

addopts =
    -q

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
